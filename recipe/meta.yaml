{% set name = "lintsampler" %}
{% set version = "1.0.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/lintsampler-{{ version }}.tar.gz
  sha256: 2c4ecc9599a50279d41023eb72dd447af91dfac4f1083d5fe5ce23bd54a8baa9

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=64
    - setuptools-scm >=8
    - pip
  run:
    - python >={{ python_min }}
    - numpy >=1.17,<3.0
    - scipy >=1.9,<2.0

test:
  imports:
    - lintsampler
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/aneeshnaik/lintsampler/
  summary: Efficient random sampling via linear interpolation.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - aneeshnaik
